# ur_plant_description — plant configuration, the single source of truth for the
# Gazebo "plant" realism parameters. Provenance tags: [V] vendor-documented,
# [L] literature-measured, [E] engineering estimate — see
# docs/ur_hardware_research.md for the underlying research.

default_ur_type: ur5e

initial_positions:
  shoulder_pan_joint: 0.0
  shoulder_lift_joint: -1.57
  elbow_joint: 0.0
  wrist_1_joint: -1.57
  wrist_2_joint: 0.0
  wrist_3_joint: 0.0

# Joint dynamics patched into the generated URDF.
# damping       : viscous damping in N·m·s/rad — Gnad et al. 2026 per-joint
#                 table (UR5e mean of two robots, w.r.t. gearbox output) [L],
#                 see docs/sources/literature/friction_table.xlsx
# friction      : written to the URDF <dynamics friction> attribute, which SDF/DART
#                 treat as a dimensionless coefficient — seeded from the Gnad
#                 Coulomb values [L], still to be calibrated empirically in the
#                 URDF (the Stage 2 plugin applies true Nm-scale friction).
# accel_limit   : informational only — no URDF/JTC parameter exists for it [E]
# NOTE: friction must leave torque budget for the documented max joint speed:
# B*omega_max + C must be well below the vendor effort limit, or the joint can
# never reach its rated speed. With the Gnad values the wrists need
# B*3.14 + C ~ 6-7 Nm against a 28 Nm limit and the shoulder/elbow
# B*3.14 + C ~ 37-41 Nm against 150 Nm — the budget holds comfortably.
# Full friction calibration in Stage 2.
joints:
  shoulder_pan_joint: {damping: 13.9, friction: 8.58, accel_limit: 3.0}
  shoulder_lift_joint: {damping: 8.9, friction: 12.94, accel_limit: 3.0}
  elbow_joint: {damping: 8.92, friction: 9.56, accel_limit: 3.5}
  wrist_1_joint: {damping: 1.26, friction: 2.24, accel_limit: 5.0}
  wrist_2_joint: {damping: 1.59, friction: 2.08, accel_limit: 5.0}
  wrist_3_joint: {damping: 1.39, friction: 2.13, accel_limit: 6.0}

sensors:
  fts:
    reference: wrist_3_joint   # gz-sim F/T sensors live on joints; see Stage 1 plan
    update_rate: 500
    frame: child               # wrist_3_link
    noise:
      # vendor-anchored conservative noise within the ±3.5 N / ±0.2 Nm precision [V]
      force: {stddev: 1.0, bias_mean: 0.0, bias_stddev: 0.2}
      torque: {stddev: 0.05, bias_mean: 0.0, bias_stddev: 0.01}
  base_imu:
    reference: base_link
    update_rate: 500
    noise:
      # chip-level grounding (ISM330IS / ICM42688); UR publishes no IMU specs [E]
      angular_velocity: {stddev: 0.0005, bias_mean: 0.0, bias_stddev: 0.0002,
                         dynamic_bias_stddev: 0.0001, dynamic_bias_correlation_time: 3600.0}
      linear_acceleration: {stddev: 0.01, bias_mean: 0.0, bias_stddev: 0.01,
                            dynamic_bias_stddev: 0.005, dynamic_bias_correlation_time: 3600.0}
  tool_accel:
    reference: tool0
    update_rate: 500
    # gyro part of this sensor is discarded at publish time (Stage 2)
    noise:
      linear_acceleration: {stddev: 0.01, bias_mean: 0.0, bias_stddev: 0.01,
                            dynamic_bias_stddev: 0.005, dynamic_bias_correlation_time: 3600.0}

# Per-model vendor tables [V]: effort limits (Nm), velocity limits (rad/s),
# integrated FTS ranges (N / Nm), payload (kg).
models:
  ur3e:
    effort_limits: [54, 54, 28, 9, 9, 9]
    velocity_limits: [3.1416, 3.1416, 3.1416, 6.2832, 6.2832, 6.2832]
    fts: {force_range: 30.0, torque_range: 10.0}
    payload_kg: 3
  ur5e:
    effort_limits: [150, 150, 150, 28, 28, 28]
    velocity_limits: [3.1416, 3.1416, 3.1416, 3.1416, 3.1416, 3.1416]
    fts: {force_range: 50.0, torque_range: 10.0}
    payload_kg: 5
  ur10e:
    effort_limits: [330, 330, 150, 54, 54, 54]
    velocity_limits: [2.0944, 2.0944, 3.1416, 3.1416, 3.1416, 3.1416]
    fts: {force_range: 100.0, torque_range: 10.0}
    payload_kg: 12.5
  ur16e:
    effort_limits: [330, 330, 150, 54, 54, 54]
    velocity_limits: [2.0944, 2.0944, 3.1416, 3.1416, 3.1416, 3.1416]
    fts: {force_range: 160.0, torque_range: 10.0}
    payload_kg: 16

# Actuator model for the Stage 2 actuator_dynamics plugin — the L2 reference
# values from octave/actuator/ (params.m / params_mech.m), the plugin's
# parameter source. Electrical [OEM] Kollmorgen TBM2G datasheets; friction
# [L] Gnad 2026 table; flexspline k0 [E] pending Madsen figure extraction.
actuator:
  model: l2                  # l2 full cascade / l1 two-mass / l0 passthrough
  fsw: 10000                 # [E] PWM frequency -> 10 kHz internal sub-steps
  wc: 3141.59                # [E] current-loop crossover, rad/s = 2*pi*500
  id_err: {R: 0.03, L: 0.08, Kt: 0.03}   # identification errors: belief = truth*(1+err)
  # One DC bus for the whole robot (all six joint drives share it) — the
  # inverter bus state from octave/actuator/inverter.m. Vsrc sag is the
  # voltage_sag fault hook (C296A44/C50A51); V_clamp = regen clamp (C56A).
  bus:
    Vdc: 48.0
    Vsrc: 48.0
    Rsrc: 0.05
    C: 0.01
    t_dt: 2.0e-6             # [E] dead time, s (0.5-2 us typical)
    V_clamp: 55.0
    eps_s: 0.5               # dead-time zero-crossing smoothing, A
  # Current measurement model (octave/actuator/sense_current.m): midpoint-
  # sampled average + 12-bit ADC + bias; ripple is an optional synthetic
  # injection with the analytic statistics (never affects dynamics).
  sense: {I_range: 30.0, bias: 0.02, ripple_on: false}
  # NOTE on the per-joint `eps` (Coulomb smoothing width): the literature
  # value 1e-3 rad/s reproduces low-speed stick-slip hunting in the 1 kHz
  # discrete loop (a real phenomenon, amplified by the DART exchange); the
  # default 0.05 rad/s keeps the Coulomb character (tanh ~ 1 at terminal
  # velocities) without the limit cycle. A stiction-aware model (Lugre) is
  # the proper long-term fix, alongside asymmetric Coulomb.
  joints:
    # J1-3: TBM2G-06826 winding D; wrists: TBM2G-05008 winding C.
    # d = modal flexspline damping (zeta = 0.03 vs the reference-mode
    # inertias of the Octave model); lambda/k2/gains derived in the plugin.
    # k0 provenance: [E] seeds (1.5e4 J1-3 / 8e3 wrist Nm/rad) — the Madsen
    # thesis figures carry the identified curve only as plots (no numeric
    # readout), so figure extraction was abandoned (2026-11-25). Literature
    # anchors: the UR patent example (CN114867584A, from this thesis) gives
    # k1 ~ 42 Nm/mrad ~ 4.2e4 Nm/rad with k3 ~ 2.4 Nm/mrad^3 ~ 2.4e9 for
    # the base joint, plus a fixed k0 = 1e4 Nm/rad in its lumped model;
    # Harmonic-Drive catalog units in the UR5e sizes span ~1.4e4-2.9e4.
    # The seeds sit at the low end of that band — a two-line change if the
    # patent values are ever confirmed.
    shoulder_pan_joint:
      {p: 10, R: 0.1085, L: 0.000145, Kt: 0.1011, Jm: 0.000064, N: 101,
       k0: 15000.0, d: 4.613, phi_ref: 0.005, s_fac: 0.5,
       pC: 8.58, pv: 13.9, pv_m: 0.0, pC_m: 0.0, eps: 0.05}
    shoulder_lift_joint:
      {p: 10, R: 0.1085, L: 0.000145, Kt: 0.1011, Jm: 0.000064, N: 101,
       k0: 15000.0, d: 4.613, phi_ref: 0.005, s_fac: 0.5,
       pC: 12.94, pv: 8.9, pv_m: 0.0, pC_m: 0.0, eps: 0.05}
    elbow_joint:
      {p: 10, R: 0.1085, L: 0.000145, Kt: 0.1011, Jm: 0.000064, N: 101,
       k0: 15000.0, d: 4.613, phi_ref: 0.005, s_fac: 0.5,
       pC: 9.56, pv: 8.92, pv_m: 0.0, pC_m: 0.0, eps: 0.05}
    wrist_1_joint:
      {p: 7, R: 0.1725, L: 0.00016, Kt: 0.0608, Jm: 0.000012, N: 101,
       k0: 8000.0, d: 0.516, phi_ref: 0.005, s_fac: 0.5,
       pC: 2.24, pv: 1.26, pv_m: 0.0, pC_m: 0.0, eps: 0.05}
    wrist_2_joint:
      {p: 7, R: 0.1725, L: 0.00016, Kt: 0.0608, Jm: 0.000012, N: 101,
       k0: 8000.0, d: 0.516, phi_ref: 0.005, s_fac: 0.5,
       pC: 2.08, pv: 1.59, pv_m: 0.0, pC_m: 0.0, eps: 0.05}
    wrist_3_joint:
      {p: 7, R: 0.1725, L: 0.00016, Kt: 0.0608, Jm: 0.000012, N: 101,
       k0: 8000.0, d: 0.516, phi_ref: 0.005, s_fac: 0.5,
       pC: 2.13, pv: 1.39, pv_m: 0.0, pC_m: 0.0, eps: 0.05}
