controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    io_and_status_controller:
      type: ur_controllers/GPIOController

    speed_scaling_state_broadcaster:
      type: ur_controllers/SpeedScalingStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController

    forward_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    forward_position_controller:
      type: position_controllers/JointGroupPositionController


speed_scaling_state_broadcaster:
  ros__parameters:
    state_publish_rate: 100.0

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
      shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
      elbow_joint: { trajectory: 0.2, goal: 0.1 }
      wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
      wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
      wrist_3_joint: { trajectory: 0.2, goal: 0.1 }
    # Starting gains, tuned empirically; i_clamp stays well below the vendor
    # joint torque ratings (150 Nm shoulder/elbow, 28 Nm wrist).
    gains:
      shoulder_pan_joint: { p: 4000.0, i: 400.0, d: 50.0, i_clamp: 40.0 }
      shoulder_lift_joint: { p: 4000.0, i: 400.0, d: 50.0, i_clamp: 40.0 }
      elbow_joint: { p: 3500.0, i: 350.0, d: 40.0, i_clamp: 40.0 }
      wrist_1_joint: { p: 800.0, i: 50.0, d: 10.0, i_clamp: 8.0 }
      wrist_2_joint: { p: 800.0, i: 50.0, d: 10.0, i_clamp: 8.0 }
      wrist_3_joint: { p: 500.0, i: 30.0, d: 5.0, i_clamp: 5.0 }


scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    speed_scaling_interface_name: ""
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
      shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
      elbow_joint: { trajectory: 0.2, goal: 0.1 }
      wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
      wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
      wrist_3_joint: { trajectory: 0.2, goal: 0.1 }
    gains:
      shoulder_pan_joint: { p: 4000.0, i: 400.0, d: 50.0, i_clamp: 40.0 }
      shoulder_lift_joint: { p: 4000.0, i: 400.0, d: 50.0, i_clamp: 40.0 }
      elbow_joint: { p: 3500.0, i: 350.0, d: 40.0, i_clamp: 40.0 }
      wrist_1_joint: { p: 800.0, i: 50.0, d: 10.0, i_clamp: 8.0 }
      wrist_2_joint: { p: 800.0, i: 50.0, d: 10.0, i_clamp: 8.0 }
      wrist_3_joint: { p: 500.0, i: 30.0, d: 5.0, i_clamp: 5.0 }

forward_velocity_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    interface_name: velocity

forward_position_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
